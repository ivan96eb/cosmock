[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmock"
version = "0.0.1"
description = "Function-first scalar-field mock map generation from one-point and two-point statistics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cosmology", "mock maps", "scalar fields", "HEALPix", "statistics"]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.15",
    "joblib>=1.2",
    "healpy>=1.16",
]

[project.optional-dependencies]
docs = [
    "sphinx>=8",
    "sphinx-rtd-theme>=3",
]
dev = [
    "build>=1.2",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["cosmock*"]
exclude = ["data*", "docs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
